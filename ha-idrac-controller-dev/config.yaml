name: "HA iDRAC Controller BETA"
version: "0.2.0-dev.1"
slug: "ha_idrac_controller_development"
description: "Monitor and control Dell iDRAC servers in Home Assistant via Redfish API with IPMI fallback. Supports iDRAC7/8/9. Development Version."
arch:
  - "aarch64"
  - "amd64"
init: false
boot: "auto"

ingress: true
ingress_port: 8099
ingress_entry: "/"
panel_icon: "mdi:server-network"
panel_title: "iDRAC Control"
panel_admin: true

options:
  master_encryption_key: ""

  # Power Control Security
  power_control_pin: ""
  power_unlock_timeout: 60

  # Default Fan Control Logic (can be overridden per server)
  temperature_unit: "C"
  base_fan_speed_percent: 20
  low_temp_threshold: 45
  high_temp_fan_speed_percent: 50
  critical_temp_threshold: 65

  # Polling and Logging
  check_interval_seconds: 30
  log_level: "info"

  # MQTT Configuration
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

schema:
  master_encryption_key: "password"

  # Power Control Security
  power_control_pin: "password?"
  power_unlock_timeout: "int(10,300)"

  # Default Fan Control Logic
  temperature_unit: "list(C|F)"
  base_fan_speed_percent: "int(0,100)"
  low_temp_threshold: "int(0,100)"
  high_temp_fan_speed_percent: "int(0,100)"
  critical_temp_threshold: "int(0,100)"

  # Polling and Logging
  check_interval_seconds: "int(5,)"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

  # MQTT Configuration
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_username: "str?"
  mqtt_password: "password?"

map:
  - "data:rw"
hassio_role: "default"
